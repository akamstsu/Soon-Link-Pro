name: Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup override set stable
          rustc --version
      - name: Read version and check release tag
        id: version
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed.' }
          $version = ($metadata.packages | Where-Object name -eq 'soon-link-pro').version
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF.StartsWith('refs/tags/') -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw 'Release tag must match Cargo.toml version.'
          }
      - name: Format and tests
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed.' }
          cargo test --locked --workspace
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
          python scripts/update-notices.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Dependency notices are incomplete.' }
      - name: Download verified build inputs
        run: ./scripts/fetch-build-tools.ps1
      - name: Install Inno Setup compiler
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $installer = Start-Process -FilePath './build/tools/innosetup-6.4.3.exe' -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$destination`"") -WindowStyle Hidden -PassThru -Wait
          if ($installer.ExitCode -ne 0) { throw "Inno Setup install failed: $($installer.ExitCode)" }
          "INNO_COMPILER=$destination\ISCC.exe" >> $env:GITHUB_ENV
      - name: Build installer
        run: ./scripts/build.ps1 -MakeInstaller -InnoCompiler $env:INNO_COMPILER -DriverInstaller './build/tools/usbip-win2-0.9.8.1-x64.exe'
      - name: Checksums
        run: |
          Get-ChildItem -LiteralPath dist -Filter '*.exe' | ForEach-Object {
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Soon-Link-Pro-Windows-x64
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Soon-Link-Pro-Windows-x64
          path: dist
      - name: Prepare versioned release tag
        id: release_tag
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$APP_VERSION"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            gh auth setup-git
            existing=$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}" | awk 'END {print $1}')
            if [[ -n "$existing" && "$existing" != "$GITHUB_SHA" ]]; then
              echo 'This version is already tagged; retain its release and publish only build artifacts.'
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ -z "$existing" ]]; then
              git tag "$tag" "$GITHUB_SHA"
              git push origin "refs/tags/$tag"
            fi
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - name: Publish versioned installer
        if: steps.release_tag.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; preserve its notes and assets.'
            exit 0
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          {
            printf 'Version: `%s` · Commit: `%s`\n\n' "$APP_VERSION" "$GITHUB_SHA"
            awk '/^# / { if (seen++) exit; next } { print }' docs/RELEASE_NOTES.md
          } > "$notes"
          args=(--verify-tag --title "Soon Link Pro $APP_VERSION" --notes-file "$notes")
          if [[ "$APP_VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* "${args[@]}"
