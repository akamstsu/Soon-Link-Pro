name: Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup override set stable
          rustc --version
      - name: Check version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed.' }
          $version = ($metadata.packages | Where-Object name -eq 'soon-link-pro').version
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag must match Cargo.toml version.' }
      - name: Format and tests
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed.' }
          cargo test --locked --workspace
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
          python scripts/update-notices.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Dependency notices are incomplete.' }
      - name: Download verified build inputs
        run: ./scripts/fetch-build-tools.ps1
      - name: Install Inno Setup compiler
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $installer = Start-Process -FilePath './build/tools/innosetup-6.4.3.exe' -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$destination`"") -WindowStyle Hidden -PassThru -Wait
          if ($installer.ExitCode -ne 0) { throw "Inno Setup install failed: $($installer.ExitCode)" }
          "INNO_COMPILER=$destination\ISCC.exe" >> $env:GITHUB_ENV
      - name: Build installer
        run: ./scripts/build.ps1 -MakeInstaller -InnoCompiler $env:INNO_COMPILER -DriverInstaller './build/tools/usbip-win2-0.9.8.1-x64.exe'
      - name: Checksums
        run: |
          Get-ChildItem -LiteralPath dist -Filter '*.exe' | ForEach-Object {
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Soon-Link-Pro-Windows-x64
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Soon-Link-Pro-Windows-x64
          path: dist
      - name: Publish tagged installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--verify-tag --generate-notes --title "Soon Link Pro ${RELEASE_TAG}")
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* "${args[@]}"
          fi
