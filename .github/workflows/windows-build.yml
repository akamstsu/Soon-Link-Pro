name: Windows installer

on:
  push:
    branches: [main]
    tags: ['dev', 'v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup override set stable
          rustc --version
      - name: Read version and check release tag
        id: version
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed.' }
          $version = ($metadata.packages | Where-Object name -eq 'soon-link-pro').version
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF -eq 'refs/tags/dev') {
            if ($version -notmatch '-dev$') { throw 'The rolling dev tag requires a -dev package version.' }
          } elseif ($env:GITHUB_REF.StartsWith('refs/tags/')) {
            if ($env:GITHUB_REF_NAME -cne "v$version" -or $version.Contains('-')) {
              throw 'Stable release tags must match a stable Cargo.toml version; development builds use dev.'
            }
          }
      - name: Format and tests
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed.' }
          cargo test --locked --workspace
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
          python scripts/update-notices.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Dependency notices are incomplete.' }
      - name: Download verified build inputs
        run: ./scripts/fetch-build-tools.ps1
      - name: Install Inno Setup compiler
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $installer = Start-Process -FilePath './build/tools/innosetup-6.4.3.exe' -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$destination`"") -WindowStyle Hidden -PassThru -Wait
          if ($installer.ExitCode -ne 0) { throw "Inno Setup install failed: $($installer.ExitCode)" }
          "INNO_COMPILER=$destination\ISCC.exe" >> $env:GITHUB_ENV
      - name: Build installer
        run: ./scripts/build.ps1 -MakeInstaller -InnoCompiler $env:INNO_COMPILER -DriverInstaller './build/tools/usbip-win2-0.9.8.1-x64.exe'
      - name: Checksums
        run: |
          Get-ChildItem -LiteralPath dist -Filter '*.exe' | ForEach-Object {
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Soon-Link-Pro-Windows-x64
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Soon-Link-Pro-Windows-x64
          path: dist
      - name: Update rolling dev tag after a main build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$APP_VERSION" != *-dev ]]; then
            echo 'Automatic dev publishing requires a -dev package version.' >&2
            exit 1
          fi
          gh auth setup-git
          previous=$(git ls-remote origin refs/tags/dev | cut -f1)
          git tag -f dev "$GITHUB_SHA"
          git push "--force-with-lease=refs/tags/dev:$previous" origin refs/tags/dev
      - name: Publish tagged installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref == 'refs/heads/main' && 'dev' || github.ref_name }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          {
            printf 'Version: `%s` · Commit: `%s`\n\n' "$APP_VERSION" "$GITHUB_SHA"
            awk '/^# / { if (seen++) exit; next } { print }' docs/RELEASE_NOTES.md
          } > "$notes"
          title="Soon Link Pro $APP_VERSION"
          if [[ "$RELEASE_TAG" == dev ]]; then title="Soon Link Pro dev · $APP_VERSION"; fi
          args=(--title "$title" --notes-file "$notes")
          if [[ "$RELEASE_TAG" == dev ]]; then args+=(--prerelease --latest=false); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" "${args[@]}"
            if [[ "$RELEASE_TAG" == dev ]]; then
              # Upload the replacement first, then remove obsolete versioned installers.
              gh release view dev --json assets --jq '.assets[].name' > "$RUNNER_TEMP/dev-assets.txt"
              while IFS= read -r asset; do
                if [[ "$asset" == Soon-Link-Pro-*-Setup-x64.exe && ! -f "dist/$asset" ]]; then
                  gh release delete-asset dev "$asset" --yes
                fi
              done < "$RUNNER_TEMP/dev-assets.txt"
            fi
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag "${args[@]}"
          fi
